[workspace]
resolver = "2"
members = ["crates/kageha-agents", "crates/kageha-browser-client", "crates/kageha-contracts", "crates/kageha-credentials", "crates/kageha-execution", "crates/kageha-integrations", "crates/kageha-knowledge", "crates/kageha-learning", "crates/kageha-mcp", "crates/kageha-memory", "crates/kageha-policy", "crates/kageha-resources", "crates/kageha-runtime", "crates/kageha-runtime-store", "crates/kageha-sandbox", "crates/kageha-services", "crates/kageha-session-client", "crates/kageha-skills", "crates/kageha-tools", "crates/kageha-ui", "crates/kageha-workflow", "crates/kageha-workspace"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[profile.release]
lto = "thin"
strip = true
