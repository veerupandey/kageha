[package]
name = "kageha-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:rusqlite", "dep:libc", "dep:fs2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
kageha-contracts = { path = "../kageha-contracts" }
rusqlite = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
fs2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
