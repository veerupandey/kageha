[package]
name = "kageha-agents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
[dependencies]
kageha-contracts = { path = "../kageha-contracts" }
kageha-policy = { path = "../kageha-policy" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[features]
default = []
sqlite = ["dep:rusqlite", "dep:fs2", "dep:libc"]

[dependencies.rusqlite]
workspace = true
optional = true
[dependencies.fs2]
workspace = true
optional = true
[dependencies.libc]
version = "0.2"
optional = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kageha-agent-profiles"
path = "src/bin/profiles.rs"
required-features = ["sqlite"]
