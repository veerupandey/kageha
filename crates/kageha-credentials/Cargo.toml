[package]
name = "kageha-credentials"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
service = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:tokio-rustls", "dep:rustls-pemfile"]
client = ["dep:reqwest"]

[dependencies]
kageha-contracts = { path = "../kageha-contracts" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
chacha20poly1305 = "0.10"
zeroize = "1"
hmac = "0.12"
getrandom = "0.2"
data-encoding = "2"
argon2 = "0.5"
libc = "0.2"
fs2.workspace = true
axum = { workspace = true, optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
tower = { version = "0.5", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kageha-credentials"
path = "src/main.rs"
required-features = ["service"]
