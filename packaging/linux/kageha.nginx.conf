# Include in nginx's http context. Set the server name and certificate paths for the installation.
map $http_upgrade $kageha_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name kageha.example.org;
    ssl_certificate /etc/ssl/kageha/fullchain.pem;
    ssl_certificate_key /etc/ssl/kageha/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kageha_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags kageha_auth secure httponly samesite=strict;
        proxy_cookie_flags kageha_native_session secure httponly samesite=strict;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
