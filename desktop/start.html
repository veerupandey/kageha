<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kageha Browser</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(ellipse at 50% 42%, rgba(52, 211, 153, 0.12), transparent 42%),
          #050608;
        color: rgba(255, 255, 255, 0.88);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .ring {
        width: 3.2rem;
        height: 3.2rem;
        margin-bottom: 1.1rem;
        border-radius: 999px;
        border: 1px solid rgba(52, 211, 153, 0.35);
        box-shadow: 0 0 32px rgba(52, 211, 153, 0.18), inset 0 0 18px rgba(52, 211, 153, 0.12);
      }
      h1 {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p {
        margin: 0.35rem 0 0;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.42);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <h1>Browser</h1>
      <p>Ask to open a page, or type a URL</p>
    </main>
  </body>
</html>
