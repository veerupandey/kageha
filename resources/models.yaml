providers:
  # Local kiro-proxy; sign in with kiro-cli before starting the proxy.
  kiro:
    protocol: openai_compat
    base_url: http://127.0.0.1:8787/v1
    api_key_env: KIRO_API_KEY
  # siliconflow:
  #   protocol: openai_compat
  #   base_url: https://api.siliconflow.com/v1
  #   api_key_env: SILICONFLOW_API_KEY
  openai:
    protocol: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  # ChatGPT / Codex subscription OAuth, owned by the local Codex CLI.
  openai-codex-app:
    protocol: codex_app_server
    base_url: ""
    api_key_env: OPENAI_CODEX_OAUTH  # sentinel; auth is owned by Codex CLI
  anthropic:
    protocol: anthropic_compat
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  zai:
    protocol: openai_compat
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
  # OpenCode Go ($10/mo) — curated open coding models via Zen gateway.
  # opencode-go:
  #   protocol: openai_compat
  #   base_url: https://opencode.ai/zen/go/v1
  #   api_key_env: OPENCODE_API_KEY
  # Command Code Provider API — OpenAI-compatible gateway for frontier and open models.
  commandcode:
    protocol: openai_compat
    base_url: https://api.commandcode.ai/provider/v1
    api_key_env: CMD_API_KEY
  # Command Code also serves Anthropic Messages-only models from this root.
  commandcode-messages:
    protocol: anthropic_compat
    base_url: https://api.commandcode.ai/provider
    api_key_env: CMD_API_KEY
  gemini:
    protocol: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
  # Cloudflare Workers AI — OpenAI-compatible chat endpoint. Account id comes
  # from the environment so no account-scoped URL is committed. Media
  # (image/tts/stt) uses /ai/run and is wired via media_providers below.
  cloudflare:
    protocol: openai_compat
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_TOKEN
