# Media capability providers (image / tts / stt / video). Pluggable: add a
# provider entry here + register a MediaAdapter for its protocol. Selection is
# per-capability (auto = first ready provider in this declared order).
media_providers:
  cloudflare:
    protocol: cloudflare_workers_ai
    api_key_env: CLOUDFLARE_API_TOKEN
    account_env: CLOUDFLARE_ACCOUNT_ID
    capabilities:
      image:
        models: ["@cf/black-forest-labs/flux-1-schnell", "@cf/leonardo/lucid-origin"]
        default: "@cf/black-forest-labs/flux-1-schnell"
      vision:
        models: ["@cf/zai-org/glm-5.3-flash", "@cf/qwen/qwen3.8-27b"]
        default: "@cf/zai-org/glm-5.3-flash"
      tts:
        models: ["@cf/deepgram/aura-2-en", "@cf/myshell-ai/melotts"]
        default: "@cf/deepgram/aura-2-en"
      stt:
        models: ["@cf/openai/whisper-large-v3-turbo"]
        default: "@cf/openai/whisper-large-v3-turbo"
  fal:
    protocol: fal
    api_key_env: FAL_KEY
    capabilities:
      image:
        models: ["fal-ai/flux/schnell", "fal-ai/flux/dev"]
        default: "fal-ai/flux/schnell"
  # Gemini TTS/STT (reuses GEMINI_API_KEY). Distinct protocols so one provider
  # name can offer both capabilities via separate adapters.
  gemini:
    protocol: gemini_tts
    api_key_env: GEMINI_API_KEY
    capabilities:
      tts:
        models: ["gemini-3.8-flash-lite-tts", "gemini-3.8-flash-tts", "gemini-3.1-flash-tts-preview"]
        default: "gemini-3.8-flash-lite-tts"
  gemini-stt:
    protocol: gemini_stt
    api_key_env: GEMINI_API_KEY
    capabilities:
      stt:
        models: ["gemini-3.6-flash"]
        default: "gemini-3.6-flash"
  openai:
    protocol: openai_audio
    api_key_env: OPENAI_API_KEY
    capabilities:
      stt:
        models: ["whisper-1"]
        default: "whisper-1"
  # Optional local voice cloning. Explicit selection only; never used by Auto.
  audio8:
    protocol: audio8_local
    auto_select: false
    voice_cloning: true
    capabilities:
      tts:
        models: ["Edge0/Audio8-TTS-Realistic-0.6b"]
        default: "Edge0/Audio8-TTS-Realistic-0.6b"
  # Future providers (register a MediaAdapter for the protocol to activate):
  # elevenlabs:
  #   protocol: elevenlabs
  #   api_key_env: ELEVENLABS_API_KEY
  #   capabilities: { tts: { models: [eleven_turbo_v2_5], default: eleven_turbo_v2_5 } }
  # openai:
  #   protocol: openai_audio
  #   api_key_env: OPENAI_API_KEY
  #   capabilities:
  #     tts: { models: [gpt-4o-mini-tts], default: gpt-4o-mini-tts }
  #     stt: { models: [whisper-1], default: whisper-1 }

embedding:
  provider: gemini
  model: gemini-embedding-001
  dimensions: 768

voice:
  provider: gemini
  model: gemini-3.8-flash-lite-tts
  voice: Kore

# OpenCode Go and SiliconFlow are disabled; use Z.AI GLM primaries in repo defaults.
# Complimentary-eligible OpenAI models are ordered fallbacks after the active primary.
# Other OpenAI API models remain selectable manually against account credit.
# General work: GPT-5.4 -> GPT-5.2 -> GPT-5.4 mini; fast roles: mini only.
# The daily allowance is not an API quota; this order handles request failures.
# Explicit model pins and user-owned fallback policy take precedence.
roles:
  default: [zai-glm-5.3-flash, gpt-5.4, gpt-5.2, gpt-5.4-mini, zai-glm-5.3-flashx, gemini-flash, claude-sonnet, cf-glm-5.3-flash, cf-deepseek-v4-flash, cf-qwen-3.8]
  planning: [zai-glm-5.3, gpt-5.4, gpt-5.2, gpt-5.4-mini, gemini-pro, claude-fable, cf-glm-5.3, cf-deepseek-v4-pro]
  fast_worker: [zai-glm-5.3-flash, gpt-5.4-mini, zai-glm-5.3-flashx, gemini-flash, cf-glm-5.3-flash, cf-deepseek-v4-flash]
  monitor: [zai-glm-5.3-flash, gpt-5.4-mini, zai-glm-5.3-flashx, gemini-flash, cf-glm-5.3-flash]
  tool_calling: [zai-glm-5.3-flash, gpt-5.4, gpt-5.2, gpt-5.4-mini, zai-glm-5.3-flashx, gemini-flash, claude-sonnet, cf-glm-5.3-flash, cf-deepseek-v4-flash, cf-qwen-3.8]
  coding: [zai-glm-5.3-flash, gpt-5.4, gpt-5.2, gpt-5.4-mini, zai-glm-5.3-flashx, gemini-flash, claude-opus, cf-glm-5.3-flash, cf-deepseek-v4-pro]
